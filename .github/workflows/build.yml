name: Build Barsik APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Barsik source
        run: |
          mkdir -p source
          unzip -q Barsik-1.2.0-GitHub-Actions.zip -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd source/Barsik
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp source/Barsik/app/build/outputs/apk/debug/app-debug.apk \
             Barsik-1.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barsik-1.2
          path: Barsik-1.2-debug.apk
